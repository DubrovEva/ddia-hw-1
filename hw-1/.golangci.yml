version: "2"

linters:
  enable:
    - nlreturn
  settings:
    nlreturn:
      block-size: 1
  exclusions:
    rules:
      - path: internal/dashgen/
        linters:
          - staticcheck
        text: "SA1019: dashboard\\."

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - ddia/hw1
