services:
  app:
    build:
      context: .
      args:
        CMD: app
    environment:
      LISTEN_ADDR: ":8080"
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 5s
      timeout: 2s
      retries: 10
      start_period: 5s
